<div class="min-h-screen bg-base-100 flex items-center justify-center p-4">
    <div class="card w-full max-w-md bg-base-100 shadow-xl">
        <div class="card-body">
            <h1 class="card-title" data-i18n="login.title">С возвращением</h1>
            <form id="loginForm">
                <input type="email" id="email" data-i18n-ph="login.email" placeholder="Email"
                    class="input input-bordered w-full mb-3" required />
                <input type="password" id="password" data-i18n-ph="login.password" placeholder="Пароль"
                    class="input input-bordered w-full mb-4" required />
                <button type="submit" data-i18n="login.submit" class="btn btn-primary w-full">Войти</button>
            </form>
            <div class="text-center mt-4">
                <span data-i18n="login.noAccount">Нет аккаунта?</span> <a href="/register"
                    data-i18n="login.register" class="link link-primary">Зарегистрироваться</a>
            </div>
            <div id="error" class="text-red-500 text-sm mt-2 min-h-[20px]"></div>
        </div>
    </div>
</div>
