<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Выбор роли — ConfHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/theme.css" />
    <script src="/js/i18n.js"></script>
</head>

<body class="min-h-screen bg-base-100 flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-base-100 rounded-lg shadow p-6">
        <h1 class="text-2xl font-bold mb-6 text-center" data-i18n="role-select.headline">Выберите роль</h1>
        <div id="roles-container" class="space-y-3"></div>
        <div id="error" class="text-red-500 text-sm min-h-[20px] mt-4"></div>
    </div>

    <!-- Ваш скрипт — с defer и обёрткой -->
    <script defer>
        document.addEventListener('DOMContentLoaded', () => {
            const roleLabels = {
                'ADMIN': { ru: 'Администратор', en: 'Administrator' },
                'USER': { ru: 'Участник', en: 'User' },
                'MODERATOR': { ru: 'Модератор', en: 'Moderator' },
                'SECTION_ADMIN': { ru: 'Администратор секции', en: 'Section Administrator' },
                'REVIEWER': { ru: 'Рецензент', en: 'Reviewer' }
            };

            function getDisplayRole(role, lang) {
                return roleLabels[role]?.[lang] || role;
            }

            const savedLang = localStorage.getItem('lang');
            const browserLang = navigator.language.startsWith('ru') ? 'ru' : 'en';
            const currentLang = savedLang || browserLang;

            const rolesContainer = document.getElementById('roles-container');
            const errorEl = document.getElementById('error');
            const roles = JSON.parse(localStorage.getItem('roles') || '[]');

            if (!Array.isArray(roles) || roles.length === 0) {
                errorEl.textContent = 'Нет доступных ролей.';
            } else if (roles.length === 1) {
                changeRoleAndRedirect(roles[0]);
            } else {
                roles.forEach(role => {
                    const button = document.createElement('button');
                    button.className = 'btn btn-outline w-full capitalize';
                    button.textContent = getDisplayRole(role, currentLang);
                    button.onclick = () => changeRoleAndRedirect(role);
                    rolesContainer.appendChild(button);
                });
            }

            async function changeRoleAndRedirect(role) {
                const token = localStorage.getItem('authToken');
                if (!token) {
                    errorEl.textContent = 'Токен отсутствует. Пожалуйста, войдите снова.';
                    return;
                }

                try {
                    // ⚠️ Убедитесь, что порт совпадает с вашим бэкендом (HTTP, не HTTPS, если не настроен)
                    const res = await fetch('https://localhost:7077/api/Auth/change-role', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ role })
                    });

                    if (!res.ok) {
                        const err = await res.json().catch(() => ({}));
                        throw new Error(err?.message || 'Не удалось сменить роль');
                    }

                    const { token: newToken, role: newRole } = await res.json();
                    localStorage.setItem('authToken', newToken);
                    localStorage.setItem('selectedRole', newRole);
                    window.location.href = '/';
                } catch (err) {
                    errorEl.textContent = err.message || 'Ошибка при смене роли';
                }
            }
        });
    </script>
</body>

</html>
